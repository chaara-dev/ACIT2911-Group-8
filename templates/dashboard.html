<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../static/dashboard.css">
    <title>Dashboard</title>
</head>

<body>
    <header>
        <h1>Dashboard</h1>
        <div id="buttons">
            <a href="../templates/subscription-create.html" class="new-subscription">New Subscription</a>
            <button class=" account">Log Out</button>
        </div>
    </header>
    <main>
        <div class="stats">
            <div class="stat-box">
                <p class="stat-text">Active Subscription(s)</p>
                <p class="stat-value" id="active-sub">4</p>
            </div>
            <div class="stat-box">
                <p class="stat-text">Next Renewal</p>
                <p class="stat-value" id="next-renew">8 days</p>
            </div>
            <div class="stat-box">
                <p class="stat-text">Total</p>
                <p class="stat-value" id="total-price">$99/m</p>
            </div>

        </div>
        <div class="action">
            <button id="filter-button">Filter</button>
            <button id="search-button">Search</button>
        </div>
        <div class="cards">
            <div class="card">
                <span>$12</span>
                <span>Netflix</span>
                <span class="date close">8 days</span>
            </div>
            <div class="card">
                <span>$18</span>
                <span>Youtube</span>
                <span class="date close">9 days</span>
            </div>
            <div class="card">
                <span>$50</span>
                <span>Microsoft</span>
                <span class="date far">20 days</span>
            </div>
            <div class="card">
                <span>$19</span>
                <span>Github</span>
                <span class="date far">28 days</span>
            </div>
        </div>
    </main>

</body>
