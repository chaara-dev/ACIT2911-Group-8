<!doctype html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="../static/css/index.css" />
    <script src="../static/js/shared.js" defer></script>
    <script src="../static/js/index.js" defer></script>
    <title>Dashboard</title>
</head>

<body>
    <header>
        <h1>Dashboard</h1>
        <div id="buttons">
            <a href="/subscription-create" class="new-subscription">New Subscription</a>
            <button class="account">Log Out</button>
        </div>
    </header>
    <main>
        <div class="stats">
            <div class="stat-box">
                <p class="stat-text">Active Subscription(s)</p>
                <p class="stat-value"><span id="active-sub"></span></p>
            </div>
            <div class="stat-box">
                <p class="stat-text">Next Renewal</p>
                <p class="stat-value"><span id="next-renew"></span> days</p>
            </div>
            <div class="stat-box">
                <p class="stat-text">Total</p>
                <p class="stat-value">$<span id="total-price"></span>/m</p>
            </div>
        </div>
        <div class="action">
            <button id="filter-button">Filter</button>
            <button id="search-button">Search</button>
        </div>
        <div class="filters">
        </div>
        <div class="cards"></div>
        </div>
    </main>
    <footer>
        <div class="footer left">
            <li>
                <a href="https://github.com/raj-singh7/ACIT2911-Group-8">Github</a>
            </li>
            <li>
                <a href="#">About Us</a>
            </li>
            <li>
                <a href="#">Contact</a>
            </li>
        </div>
        <div class="footer right">
            Created by Group-8 for ACIT2911
            </br>
            &copy; 2026
        </div>
    </footer>
</body>

</html>
